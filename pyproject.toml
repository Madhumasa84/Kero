[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kerascan"
version = "0.1.0"
description = "Offline KERASCAN Placido-image screening research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==5.0.0.93",
  "pydantic==2.13.4",
  "fastapi==0.136.3",
  "PyYAML==6.0.3",
  "python-multipart==0.0.29",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.12.10",
]

[project.scripts]
kera-analyze = "corneal_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
